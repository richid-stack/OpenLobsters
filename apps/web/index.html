<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <title>OpenLobs</title>
  <meta name="description" content="An open agent workspace that knows what to do, shows what it is doing, and asks before it acts." />
  <style>
    html, body, #app { margin: 0; padding: 0; width: 100vw; height: 100vh; min-height: 100dvh; overflow: hidden; }
    html { background-color: #fafafa }
    html.dark { background-color: #09090b }
  </style>
  <script>
    (function () {
      var mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
      var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) {
        document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#09090b')
      }
    })()
  </script>
</head>
<body>
  <div id="app" class="w-screen h-screen min-h-[100dvh] overflow-hidden isolate"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
