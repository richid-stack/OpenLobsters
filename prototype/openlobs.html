const LP=()=>{const AC=[['sparkle','Ask and get sources','Chat with OpenLobs and see what it searched, with numbered citations you can open and check.','a','A chat with a cited answer'],['shield','Agents that ask first','OpenLobs asks before it uses a tool. Allow once, always allow, or deny, and reset your choices any time.','e','The approval prompt'],['bulb','Remember what matters','Save preferences and facts once. See every memory, edit it, or turn memory off.','b','The memory manager'],['folder','Keep work together','Group chats into projects, and bring in agents for the job.','c','Projects with chats'],['gear','Make it yours','Themes, accent colours, voice, passcode lock, hidden chats and more.','d','The settings menu']],
FQ=[['What is OpenLobs and how does it work?','OpenLobs is a chat and agent workspace. Opened on claude.ai, replies come from Claude through your own account, and web search runs through the Parallel Search connector if you have it connected. Without that it falls back to scripted demo replies.'],['Does the agent ask before it acts?','By default, yes for web search. You choose Allow once, Always allow or Deny, and Settings, Privacy and security lets you ask for every tool or none.'],['Where is my data stored?','Your chats, memories and settings are saved in this browser only. Your name and email are never sent to an account server.'],['Is it open source, and what does it cost?','It is free to use here. It is not open source yet, but that is the plan, along with a skills library and a community.']],
row=(h,b,o)=>`<div class="ax${o?' open':''}"><button class="ah" aria-expanded="${!!o}">${h}<i>${ic('chevr',20)}</i></button><div class="ab"${o?'':' hidden'}>${b}</div></div>`;
return `<div class="lp"><div class="bar"><b>${lob(32)}<span>OpenLobs</span></b><button class="tryb" id="t1">Try OpenLobs</button></div>
<section class="hs"><h1>The open AI agent you control</h1><div class="two"><div class="bc"><div class="bh"><span class="app">${lob(30)}</span><b>Try it now</b></div><p>Jump in as a guest. Nothing to install and nothing to set up.</p><button class="wb" id="gu">Start chatting</button></div><div class="bc" id="acd"></div></div></section>
<section class="ms"><h2 class="rv0">Meet OpenLobs</h2><p class="big rv0">OpenLobs is an open chat and agent workspace. It answers with sources, asks before it acts, and keeps your work on your device.</p><div class="acc rv0">${AC.map((x,i)=>row(`${ic(x[0],22)}<span>${x[1]}</span>`,`<p>${x[2]}</p><div class="shot"><img src="${SH[x[3]]}" alt="${x[4]}"></div>`,i==0)).join('')}</div></section>
<section class="opx"><h2 class="rv0">Open by design</h2><p class="big rv0">Agents are only as safe as what they are allowed to do. Third-party agent skills have already been caught leaking data, so OpenLobs puts permissions first and plans to build in the open.</p><div class="ogx rv0">${[['Open source','The plan is to open the code so anyone can read it, run it and improve it.'],['Skills you can share','Package what an agent can do and share it, with its permissions spelled out up front.'],['A community','A place to swap skills, ideas and fixes with the people using OpenLobs.']].map(x=>`<div class="ocx"><h4>${x[0]}<span class="bdg">Coming soon</span></h4><p>${x[1]}</p></div>`).join('')}</div></section>
<section class="plx"><h2 class="rv0">Explore OpenLobs</h2><div class="bc pc rv0"><span class="pi">${lob(64)}</span><h3>Free</h3><span class="pt">Try OpenLobs</span><div class="pr">$0</div><span class="pm">Free while it is a demo build</span><button class="wb" id="pl">Start chatting</button><ul>${['Chat with web search and sources','Approval prompts before tools run','Memory across conversations','Projects, agents and voice'].map(t=>`<li>${CK}<span>${t}</span></li>`).join('')}</ul></div><p class="fn">Live replies and search depend on opening this page on claude.ai with the connectors enabled. Screenshots are illustrative.</p></section>
<section class="qs"><h2 class="rv0">Frequently asked questions</h2><div class="acc rv0">${FQ.map(x=>row(`<span>${x[0]}</span>`,`<p>${x[1]}</p>`,0)).join('')}</div></section>
<footer class="ftr"><div class="fi"><b class="fb">${lob(34)}<span>OpenLobs</span></b><div class="fg"><div><h5>Product</h5>${['Ask and get sources','Agents that ask first','Remember what matters','Keep work together','Make it yours'].map((t,i)=>`<button class="fk" data-o="${i}">${t}</button>`).join('')}</div><div><h5>Get started</h5><button class="fk" data-m="1">Sign up</button><button class="fk" data-m="0">Log in</button><button class="fk" data-g="1">Continue as guest</button></div></div><div class="wm">OPENLOBS</div><span class="cp">\u00a9 2026 OpenLobs. Demo build.</span></div></footer></div>`};
