openapi: 3.1.0
info:
  title: OpenLobs API
  version: 1.0.0
  description: Contract between the OpenLobs frontend and backend. The chat stream is Server-Sent Events;
    every `data:` line is one `Event`.
paths:
  /v1/chat/stream:
    post:
      summary: Start a run and stream its events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: text/event-stream. Each `data:` line is a JSON Event.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
  /v1/approvals:
    post:
      summary: Answer an approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalBody'
      responses: &id001
        '200':
          description: OK
  /v1/runs/{run}/stop:
    post:
      summary: Stop a running run
      parameters:
      - name: run
        in: path
        required: true
        schema:
          type: string
      responses: *id001
  /v1/resources/{type}:
    get:
      summary: List or search resources (capability search)
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: &id002
          - agent
          - library
          - mcp
          - memory
          - permission
          - project
          - relationship
          - run
          - skill
          - tool
          - workflow
      - name: q
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
      responses: *id001
  /v1/resources/{type}/{id}:
    get:
      summary: Get one resource
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: *id002
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses: *id001
  /v1/relationships:
    get:
      summary: Relationships of a resource
      parameters:
      - name: type
        in: query
        schema:
          type: string
      - name: id
        in: query
        schema:
          type: string
      responses: *id001
  /v1/permissions:
    get:
      summary: List permissions
      responses: *id001
    put:
      summary: Set a permission
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission'
      responses: *id001
