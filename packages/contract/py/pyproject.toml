[project]
name = "openlobs-contract"
version = "1.0.0"
description = "Typed event stream and resource schemas shared by the OpenLobs frontend, mock server and backend."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
